<svg width="680" height="720" viewBox="0 0 680 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeCurve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26B45"/>
      <stop offset="100%" stop-color="#E2552D"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2838"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD5BD"/>
      <stop offset="100%" stop-color="#EBB69B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15213C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Orange organic backdrop curve -->
  <path d="M220 180 C180 80, 420 40, 520 120 C620 200, 660 380, 580 500 C500 620, 280 660, 200 560 C120 460, 260 280, 220 180 Z" fill="url(#orangeCurve)"/>

  <!-- Person Body Silhouette / Stylized Portrait -->
  <!-- Neck -->
  <rect x="362" y="210" width="36" height="50" rx="6" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="380" cy="160" rx="42" ry="54" fill="url(#skinGrad)"/>
  <!-- Hair -->
  <path d="M336 150 C336 100, 360 85, 410 90 C425 92, 432 110, 425 135 C420 125, 410 120, 395 120 C375 120, 360 135, 345 145 Z" fill="#1C1917"/>

  <!-- Eyes & Smile -->
  <circle cx="366" cy="155" r="3" fill="#3F2618"/>
  <circle cx="396" cy="155" r="3" fill="#3F2618"/>
  <path d="M374 180 Q381 190 388 180" stroke="#C27A5B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Shoulders & Dark Jacket -->
  <path d="M260 260 C290 235, 350 230, 380 235 C410 230, 470 235, 500 260 L540 450 L220 450 Z" fill="url(#bodyGrad)"/>
  <!-- Collar & Shirt -->
  <path d="M365 240 L380 280 L395 240 Z" fill="#FFFFFF"/>

  <!-- Hands holding modern tablet / screen -->
  <g filter="url(#shadow)">
    <!-- Tablet body -->
    <rect x="290" y="320" width="280" height="190" rx="14" fill="#0E1726" stroke="#2D3B55" stroke-width="3"/>
    <!-- Screen content -->
    <rect x="300" y="330" width="260" height="170" rx="8" fill="#15213C"/>
    <!-- Mockup content inside tablet -->
    <rect x="312" y="342" width="70" height="14" rx="4" fill="#F26B45"/>
    <rect x="312" y="366" width="140" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="312" y="384" width="110" height="8" rx="2" fill="#8896AB"/>
    <rect x="312" y="405" width="64" height="16" rx="4" fill="#F26B45"/>

    <!-- Mini chart on tablet -->
    <rect x="440" y="350" width="105" height="120" rx="6" fill="#101D35" stroke="#253554" stroke-width="1.5"/>
    <path d="M450 430 Q470 390 490 410 T530 370" fill="none" stroke="#F26B45" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="530" cy="370" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Left and right thumbs holding tablet -->
  <ellipse cx="288" cy="390" rx="12" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="572" cy="400" rx="12" ry="16" fill="url(#skinGrad)"/>
</svg>
