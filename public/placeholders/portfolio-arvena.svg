<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="380" rx="16" fill="#F8F9FA"/>

  <!-- Modern Villa Architecture graphic on right -->
  <rect x="300" y="50" width="270" height="280" rx="10" fill="#E9ECEF"/>
  <!-- Villa walls, glass panels, pool/garden hint -->
  <rect x="320" y="80" width="160" height="120" rx="4" fill="#CED4DA"/>
  <rect x="490" y="90" width="70" height="180" rx="4" fill="#ADB5BD"/>
  <rect x="330" y="95" width="60" height="90" fill="#74C0FC" fill-opacity="0.3"/>
  <rect x="400" y="95" width="70" height="90" fill="#74C0FC" fill-opacity="0.4"/>
  <rect x="320" y="210" width="150" height="100" rx="4" fill="#DEE2E6"/>
  <rect x="320" y="310" width="240" height="10" fill="#51CF66" fill-opacity="0.3"/>

  <!-- Left typography -->
  <text x="40" y="60" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#212529">ARVENA</text>

  <text x="40" y="130" font-family="serif" font-size="30" font-weight="700" fill="#15213C">A More Meaningful</text>
  <text x="40" y="168" font-family="serif" font-size="30" font-weight="700" fill="#15213C">Way to Live</text>

  <text x="40" y="205" font-family="sans-serif" font-size="12" fill="#6C757D">Thoughtfully designed residences in harmony</text>
  <text x="40" y="223" font-family="sans-serif" font-size="12" fill="#6C757D">with nature, for a better tomorrow.</text>

  <!-- Stats block -->
  <g transform="translate(40, 260)">
    <text x="0" y="16" font-family="sans-serif" font-size="18" font-weight="700" fill="#15213C">50+</text>
    <text x="0" y="32" font-family="sans-serif" font-size="10" fill="#6C757D">Units</text>

    <text x="70" y="16" font-family="sans-serif" font-size="18" font-weight="700" fill="#15213C">8 Ha</text>
    <text x="70" y="32" font-family="sans-serif" font-size="10" fill="#6C757D">Green Area</text>

    <text x="150" y="16" font-family="sans-serif" font-size="18" font-weight="700" fill="#15213C">100%</text>
    <text x="150" y="32" font-family="sans-serif" font-size="10" fill="#6C757D">Eco-living</text>
  </g>
</svg>
