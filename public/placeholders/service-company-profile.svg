<svg width="420" height="280" viewBox="0 0 420 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Browser frame with white body -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="400" height="260" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Browser titlebar -->
    <rect x="10" y="10" width="400" height="28" rx="10" fill="#F8FAFC"/>
    <circle cx="28" cy="24" r="3.5" fill="#EF4444"/>
    <circle cx="39" cy="24" r="3.5" fill="#F59E0B"/>
    <circle cx="50" cy="24" r="3.5" fill="#10B981"/>
    <rect x="80" y="18" width="220" height="12" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Navbar -->
    <rect x="30" y="52" width="60" height="10" rx="3" fill="#15213C"/>
    <rect x="250" y="54" width="30" height="6" rx="2" fill="#94A3B8"/>
    <rect x="290" y="54" width="30" height="6" rx="2" fill="#94A3B8"/>
    <rect x="330" y="50" width="55" height="15" rx="7.5" fill="#F26B45"/>

    <!-- Hero Content Left -->
    <rect x="30" y="80" width="130" height="16" rx="4" fill="#15213C"/>
    <rect x="30" y="102" width="95" height="16" rx="4" fill="#F26B45"/>
    <rect x="30" y="126" width="140" height="6" rx="2" fill="#94A3B8"/>
    <rect x="30" y="136" width="120" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="30" y="152" width="70" height="20" rx="6" fill="#15213C"/>

    <!-- Hero Image Card Right -->
    <rect x="195" y="78" width="190" height="110" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <rect x="205" y="88" width="170" height="60" rx="6" fill="#0284C7" fill-opacity="0.15"/>
    <!-- Building silhouette inside preview -->
    <rect x="220" y="105" width="30" height="43" fill="#0284C7" fill-opacity="0.6"/>
    <rect x="255" y="95" width="40" height="53" fill="#0284C7" fill-opacity="0.8"/>
    <rect x="300" y="110" width="35" height="38" fill="#0284C7" fill-opacity="0.5"/>
    <rect x="205" y="158" width="90" height="8" rx="2" fill="#1E293B"/>
    <rect x="205" y="172" width="130" height="6" rx="2" fill="#64748B"/>

    <!-- 3 Bottom feature cards -->
    <rect x="30" y="202" width="105" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="45" cy="218" r="6" fill="#F26B45" fill-opacity="0.2"/>
    <rect x="58" y="215" width="60" height="6" rx="2" fill="#1E293B"/>
    <rect x="42" y="232" width="75" height="5" rx="2" fill="#94A3B8"/>

    <rect x="145" y="202" width="105" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="160" cy="218" r="6" fill="#0284C7" fill-opacity="0.2"/>
    <rect x="173" y="215" width="60" height="6" rx="2" fill="#1E293B"/>
    <rect x="157" y="232" width="75" height="5" rx="2" fill="#94A3B8"/>

    <rect x="260" y="202" width="125" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="275" cy="218" r="6" fill="#10B981" fill-opacity="0.2"/>
    <rect x="288" y="215" width="70" height="6" rx="2" fill="#1E293B"/>
    <rect x="272" y="232" width="85" height="5" rx="2" fill="#94A3B8"/>
  </g>
</svg>
