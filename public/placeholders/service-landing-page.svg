<svg width="420" height="280" viewBox="0 0 420 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="laptopShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="phoneShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Laptop Mockup in background -->
  <g filter="url(#laptopShadow)">
    <!-- Screen Bezel -->
    <rect x="25" y="20" width="280" height="180" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Web Content Inside Laptop -->
    <rect x="35" y="30" width="260" height="160" rx="6" fill="#FFFFFF"/>

    <!-- Top Nav -->
    <rect x="35" y="30" width="260" height="18" fill="#F8FAFC"/>
    <rect x="45" y="36" width="30" height="6" rx="2" fill="#15213C"/>
    <rect x="220" y="34" width="45" height="10" rx="3" fill="#F26B45"/>

    <!-- Hero Content -->
    <rect x="45" y="58" width="60" height="8" rx="2" fill="#F26B45" fill-opacity="0.2"/>
    <rect x="45" y="72" width="100" height="12" rx="3" fill="#15213C"/>
    <rect x="45" y="88" width="80" height="12" rx="3" fill="#F26B45"/>
    <rect x="45" y="106" width="105" height="6" rx="2" fill="#64748B"/>
    <rect x="45" y="116" width="90" height="6" rx="2" fill="#94A3B8"/>
    <rect x="45" y="132" width="60" height="16" rx="5" fill="#F26B45"/>

    <!-- Right Hero Graphic inside Laptop -->
    <rect x="165" y="60" width="115" height="110" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <path d="M175 130 C195 100, 220 140, 245 90 L265 110" stroke="#0284C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="175" y="70" width="50" height="8" rx="2" fill="#1E293B"/>
    <rect x="175" y="82" width="80" height="6" rx="2" fill="#94A3B8"/>

    <!-- Laptop Base / Hinge -->
    <path d="M10 200 L320 200 L305 210 L25 210 Z" fill="#E2E8F0" stroke="#CBD5E1"/>
    <rect x="135" y="200" width="60" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Mobile Phone Mockup in Foreground Right -->
  <g filter="url(#phoneShadow)">
    <!-- Phone Body -->
    <rect x="270" y="60" width="115" height="195" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Screen -->
    <rect x="276" y="68" width="103" height="179" rx="12" fill="#FFFFFF"/>
    <!-- Speaker notch -->
    <rect x="312" y="73" width="30" height="4" rx="2" fill="#0F172A"/>

    <!-- Phone App Content -->
    <rect x="286" y="86" width="40" height="7" rx="2" fill="#15213C"/>
    <rect x="286" y="100" width="75" height="10" rx="3" fill="#15213C"/>
    <rect x="286" y="114" width="55" height="10" rx="3" fill="#F26B45"/>

    <rect x="286" y="132" width="83" height="45" rx="6" fill="#FFF5F1" stroke="#FCD5BD"/>
    <rect x="294" y="140" width="45" height="6" rx="2" fill="#F26B45"/>
    <rect x="294" y="152" width="65" height="5" rx="2" fill="#8896AB"/>
    <rect x="294" y="162" width="35" height="8" rx="3" fill="#F26B45"/>

    <rect x="286" y="186" width="83" height="45" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="294" y="196" width="50" height="6" rx="2" fill="#15213C"/>
  </g>
</svg>
